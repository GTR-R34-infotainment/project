<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GT-R · Infotainment interativo</title>
<style>
:root{color-scheme:dark;--ac:#2f7bff;--b:1;--bg:#050b1c;--pn:#0d1f47;--ln:#1f3f86;--tx:#e8eefc;--mu:#8fa3c8;--bd:#0a1632}
.night{--ac:#ffa23a;--pn:#2a1a0a;--ln:#6b4412;--bg:#120a04;--tx:#ffe9cf;--mu:#c9a77d;--bd:#1c1007}
*{box-sizing:border-box;margin:0;font-family:"Segoe UI","DejaVu Sans",Arial,sans-serif}
html,body{height:100%;background:#02050f;overflow:hidden}
body{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#stage{position:absolute;left:50%;top:50%;width:1200px;height:520px;transform-origin:center;color:var(--tx);background:radial-gradient(800px 400px at 50% 20%,var(--bd),var(--bg));border:2px solid var(--ac);border-radius:26px;overflow:hidden;filter:brightness(var(--b));font-size:14px;transition:background .4s}
button{border:0;background:none;color:inherit;cursor:pointer;font-size:inherit}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{position:absolute;left:0;right:0;top:0;height:44px;display:flex;align-items:center;gap:18px;padding:0 24px;font-size:15px}
.top .sp{margin-left:auto}.call{background:#16a34a;border-radius:14px;padding:2px 12px;font-size:12px}
.rail{position:absolute;left:14px;top:52px;bottom:14px;width:56px;display:flex;flex-direction:column;justify-content:space-between}
.rail button{height:48px;border-radius:10px;font-size:24px;color:#9db6e8;display:grid;place-items:center}
.rail button.on{background:var(--ac);color:#fff}
.view{position:absolute;left:84px;right:18px;top:52px;bottom:16px}
.cd{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px;text-align:left;color:inherit}
button.cd:hover{border-color:var(--ac)}
.mu{color:var(--mu)}.row{display:flex;align-items:center;gap:12px}
h1{font-size:28px}h2{font-size:18px;margin-bottom:10px}
.hm{display:grid;grid-template-columns:1fr 380px;grid-template-rows:200px 1fr;gap:14px;height:100%}
.hero{grid-row:1/3;border-radius:12px;background-size:cover;background-position:center;padding:22px;border:1px solid var(--ln)}
.hero p{margin-top:4px;color:#dbe6ff}
.art{border-radius:8px;background:radial-gradient(circle at 50% 40%,#d36bff,#4b2bd6 45%,#0b1a66);flex:none}
.ctl{display:flex;justify-content:center;align-items:center;gap:26px;font-size:20px;margin-top:12px}
.pp{width:48px;height:48px;border-radius:50%;border:2px solid var(--ac);background:var(--pn);font-size:15px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ic{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--ac);color:#fff;font-size:22px;flex:none}
.rw{display:flex;justify-content:space-between;align-items:center;min-height:50px;border-bottom:1px solid var(--ln)}
.tg{width:48px;height:26px;border-radius:13px;background:#334;position:relative}
.tg:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--ac)}.tg.on:after{left:25px}
.sg{display:flex;background:#0006;border-radius:8px;padding:3px}.sg button{padding:6px 14px;border-radius:6px;color:var(--mu)}.sg .on{background:var(--ac);color:#fff}
.bt{background:var(--ac);color:#fff;padding:8px 16px;border-radius:8px}
.sd{display:flex;flex-direction:column;gap:6px;width:200px}.sd button{padding:12px 14px;border-radius:8px;text-align:left}.sd .on{background:var(--ac);color:#fff}
.split{display:flex;gap:16px;height:100%}.split>.cd{flex:1}
input[type=range]{width:210px;accent-color:var(--ac)}
.bar{height:6px;border-radius:3px;background:var(--ln);cursor:pointer;margin:14px 0}.bar i{display:block;height:100%;border-radius:3px;background:var(--ac)}
.tr{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:8px;text-align:left}.tr.on{background:var(--ac);color:#fff}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}.pad button{height:52px;border-radius:10px;background:var(--pn);border:1px solid var(--ln);font-size:20px}
.end{background:#e11d48;color:#fff;width:64px;height:64px;border-radius:50%;font-size:24px}.ok{background:#16a34a}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:20px}.apps button{text-align:center;color:var(--tx)}
.apps b{display:grid;place-items:center;width:84px;height:84px;margin:0 auto 8px;border-radius:20px;font-size:38px;color:#fff}
#toast{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);background:#000c;border:1px solid var(--ac);padding:12px 26px;border-radius:30px;display:none}
#toast.on{display:block}
</style></head><body><div id="stage"><div class="top" id="top"></div><nav class="rail" id="rail"></nav><div class="view" id="view"></div><div id="toast" role="status"></div></div>

const SC=[['Sistema',[['sl','bright','Brilho da tela'],['tog','night','Modo noturno'],['btn','upd','Atualização de software']]],['Som',[['sl','vol','Volume'],['seg','eq','Equalizador',['Normal','Graves','Vocal']]]],['Conectividade',[['tog','wifi','Wi-Fi'],['tog','bt','Bluetooth'],['tog','hot','Roteador Wi-Fi']]],['Tela',[['sl','bright','Brilho da tela'],['tog','night','Modo noturno']]],['Idioma',[['seg','lang','Idioma',['Português','English','Español']],['note','','A tradução da interface ainda não está disponível.']]]];
const $=s=>document.querySelector(s),mm=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const g=k=>k in S.V?S.V[k]:S[k],st=(k,v)=>{k in S.V?S.V[k]=v:S[k]=v};
const art=s=>`<div class="art" style="width:${s}px;height:${s}px"></div>`;
const ctl=()=>`<div class="ctl"><button data-a="prev" aria-label="Anterior">⏮</button><button class="pp" data-a="pp" aria-label="Reproduzir ou pausar">${S.play?'❚❚':'▶'}</button><button data-a="next" aria-label="Próxima">⏭</button></div>`;
const go=(v,h)=>`<button class="cd" data-a="go" data-v="${v}">${h}</button>`;
function rows(list){return list.map(([ty,k,l,o])=>{const v=g(k);let c='';
if(ty=='tog')c=`<button class="tg ${v?'on':''}" data-a="tg" data-k="${k}" aria-label="${l}"></button>`;
if(ty=='seg')c=`<div class="sg">${o.map(x=>`<button class="${x==v?'on':''}" data-a="sg" data-k="${k}" data-v="${x}">${x}</button>`).join('')}</div>`;
if(ty=='step')c=`<div class="row"><button class="bt" data-a="stp" data-k="${k}" data-d="-1">−</button><b id="tv">${v} °C</b><button class="bt" data-a="stp" data-k="${k}" data-d="1">+</button></div>`;
if(ty=='sl')c=`<input type="range" min="${k=='bright'?40:0}" max="100" value="${v}" data-k="${k}" aria-label="${l}">`;
if(ty=='btn')c=`<button class="bt" data-a="upd">${S.upd||'Verificar agora'}</button>`;
if(ty=='note')return `<p class="mu" style="padding-top:12px;font-size:12px">${o}</p>`;
return `<div class="rw"><span>${l}</span>${c}</div>`}).join('')}
const V={
home(){const[n,a]=T[S.tr],d=D[S.dest];return `<div class="hm"><div class="hero" style="background-image:linear-gradient(#000b,#0000 55%),url(${CAR})"><h1>Bem-vindo ao seu GT-R</h1><p>Pronto para a próxima jornada?</p></div>
<div class="cd"><button class="row" data-a="go" data-v="music">${art(76)}<div style="text-align:left"><b style="font-size:18px">${n}</b><div class="mu">${a}</div></div></button>${ctl()}</div>
<div class="g2">${go('nav',`<div class="row"><span class="ic">${I('nav')}</span><div><b>${d[0]}</b><div class="mu">${d[1]} • ${d[2]}</div></div></div>`)}${go('car',`<div class="row"><span class="ic" style="background:#16a34a">${I('gear')}</span><div><div>Pressão dos pneus</div><b style="color:#22c55e">✔ OK</b></div></div>`)}</div></div>`},
music(){const[n,a,d]=T[S.tr];return `<div class="split"><div class="cd" style="flex:1.2"><div class="row" style="gap:22px">${art(150)}<div><h1>${n}</h1><div class="mu" style="font-size:17px">${a}</div></div></div>
<div class="bar" id="pg" data-a="seek"><i style="width:${S.t/d*100}%"></i></div><div class="row mu" style="justify-content:space-between"><span class="ct" id="pt">${mm(S.t)}</span><span>${mm(d)}</span></div>
<div class="ctl" style="gap:32px"><button data-a="shuf" style="color:${S.shuf?'var(--ac)':'inherit'}" aria-label="Aleatório">⤮</button><button data-a="prev">⏮</button><button class="pp" data-a="pp">${S.play?'❚❚':'▶'}</button><button data-a="next">⏭</button><button data-a="rep" style="color:${S.rep?'var(--ac)':'inherit'}" aria-label="Repetir">⟲</button></div>
<div class="row" style="margin-top:22px;justify-content:center">🔈<input type="range" min="0" max="100" value="${S.vol}" data-k="vol" aria-label="Volume">🔊</div></div>
<div class="cd"><h2>Fila de reprodução</h2>${T.map((t,i)=>`<button class="tr ${i==S.tr?'on':''}" data-a="trk" data-v="${i}">${art(36)}<div style="flex:1"><b>${t[0]}</b><div style="font-size:12px;opacity:.8">${t[1]}</div></div>${mm(t[2])}</button>`).join('')}</div></div>`},
nav(){const e=D[S.dest][3];return `<div class="split"><div class="cd" style="flex:1.5;padding:0;position:relative;overflow:hidden"><svg viewBox="0 0 560 420" style="width:100%;height:100%;stroke:var(--ln);stroke-width:2"><path d="M0 70h560M0 190h560M0 300h560M90 0v420M240 0v420M400 0v420M0 400L560 20"/>${S.nav?`<path d="M280 330V250H${e[0]}V${e[1]}" stroke="var(--ac)" stroke-width="6" stroke-dasharray="14 8"/>`:''}<circle cx="${e[0]}" cy="${e[1]}" r="9" fill="#e11d48" stroke="none"/><circle cx="280" cy="330" r="14" fill="var(--ac)" stroke="#fff"/></svg>
<div style="position:absolute;left:16px;bottom:14px;font-size:22px"><b id="spd">${S.nav?S.spd:0}</b> <small class="mu">km/h</small></div></div>
<div class="cd"><h2>Destinos</h2>${D.map((d,i)=>`<button class="tr ${i==S.dest?'on':''}" data-a="dst" data-v="${i}"><span style="flex:1"><b>${d[0]}</b></span>${d[1]} • ${d[2]}</button>`).join('')}
<button class="bt" data-a="route" style="width:100%;margin-top:16px;padding:14px">${S.nav?'Encerrar rota':'Iniciar rota'}</button>${S.nav?`<p class="mu" style="margin-top:12px">Rota ativa até ${D[S.dest][0]} · ${D[S.dest][2]}</p>`:''}</div></div>`},
phone(){const c=S.call;return `<div class="split"><div class="cd">${c?`<div class="row" style="gap:18px"><span class="ic" style="width:64px;height:64px">◉</span><div><h1 style="font-size:24px">${c.n}</h1><div class="mu">Ligação em andamento…</div><b class="ct">${mm(c.s)}</b></div></div>
<div class="ctl" style="gap:22px;margin-top:40px"><button class="bt" data-a="mute" style="${S.mute?'':'background:var(--pn)'}">${S.mute?'Sem microfone':'Microfone'}</button><button class="bt" data-a="spk" style="${S.spk?'':'background:var(--pn)'}">Viva-voz</button><button class="end" data-a="hang" aria-label="Encerrar">☎</button></div>`
:`<div style="text-align:center;font-size:26px;height:40px;letter-spacing:2px">${S.dial||'<span class="mu" style="font-size:15px">Digite um número</span>'}</div><div class="pad">${'123456789*0#'.split('').map(k=>`<button data-a="key" data-v="${k}">${k}</button>`).join('')}</div>
<div class="ctl" style="margin-top:12px;gap:30px"><button data-a="del" aria-label="Apagar">⌫</button><button class="end ok" data-a="dial" aria-label="Ligar">☎</button></div>`}</div>
<div class="cd"><h2>Recentes</h2>${C.map(x=>`<button class="tr" data-a="ring" data-v="${x[0]}"><span class="ic" style="width:34px;height:34px;background:#26324f">◉</span><span style="flex:1"><b>${x[0]}</b><div class="mu" style="font-size:12px">${x[1]}</div></span>☎</button>`).join('')}</div></div>`},
car(){const[nm,it]=VC[S.veh];return `<div class="split"><div class="sd">${VC.map((v,i)=>`<button class="${i==S.veh?'on':''}" data-a="vtab" data-v="${i}">${v[0]}</button>`).join('')}</div><div class="cd"><h2>${nm}</h2>${rows(it)}${S.veh==1?`<div class="rw"><span>Pressão dos pneus</span><b style="color:#22c55e">✔ OK</b></div>`:''}</div></div>`},
apps(){return `<div class="cd apps" style="height:100%">${AP.map((a,i)=>`<button data-a="app" data-v="${i}"><b style="background:${a[1]}">${a[0][0]}</b>${a[0]}</button>`).join('')}</div>`},
gear(){const[nm,it]=SC[S.set];return `<div class="split"><div class="sd">${SC.map((v,i)=>`<button class="${i==S.set?'on':''}" data-a="stab" data-v="${i}">${v[0]}</button>`).join('')}</div><div class="cd"><h2>${nm}</h2>${rows(it)}</div></div>`}};
function draw(){const now=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
$('#top').innerHTML=`<b id="clk" style="font-size:18px">${now}</b><span>▂▄▆ ${S.wifi?'4G · Wi-Fi':'4G'}</span>${S.call?`<button class="call" data-a="go" data-v="phone">☎ <span class="ct">${mm(S.call.s)}</span></button>`:''}<span class="sp">☁ 22 °C</span><span>◉</span>`;
$('#rail').innerHTML=R.map(([i,l])=>`<button class="${S.scr==i?'on':''}" data-a="go" data-v="${i}" aria-label="${l}" title="${l}">${I(i)}</button>`).join('');
$('#view').innerHTML=V[S.scr]();$('#stage').classList.toggle('night',S.night);document.documentElement.style.setProperty('--b',S.bright/100)}
function nx(d){S.tr=S.shuf?Math.floor(Math.random()*T.length):(S.tr+d+T.length)%T.length;S.t=0;S.play=true;draw()}
function toast(m,f){const e=$('#toast');e.textContent=m;e.classList.add('on');setTimeout(()=>{e.classList.remove('on');f&&f()},1400)}
const A={go:v=>{S.scr=v.v},pp:()=>S.play=!S.play,next:()=>{nx(1);return 'skip'},prev:()=>{if(S.t>3)S.t=0;else{nx(-1);return 'skip'}},shuf:()=>S.shuf=!S.shuf,rep:()=>S.rep=!S.rep,trk:v=>{S.tr=+v.v;S.t=0;S.play=true},
dst:v=>S.dest=+v.v,route:()=>{S.nav=!S.nav;S.spd=S.nav?50:0},key:v=>{if(S.dial.length<14)S.dial+=v.v},del:()=>S.dial=S.dial.slice(0,-1),dial:v=>{if(S.dial)S.call={n:S.dial,s:0},S.dial=''},ring:v=>S.call={n:v.v,s:0},hang:()=>{S.call=null;S.mute=false},mute:()=>S.mute=!S.mute,spk:()=>S.spk=!S.spk,
vtab:v=>S.veh=+v.v,stab:v=>S.set=+v.v,tg:v=>st(v.k,!g(v.k)),sg:v=>st(v.k,v.v),stp:v=>S.V[v.k]=Math.min(28,Math.max(16,S.V[v.k]+ +v.d)),
upd:()=>{S.upd='Verificando…';draw();setTimeout(()=>{S.upd='Sistema atualizado';draw()},1500);return 'skip'},
app:v=>{const a=AP[+v.v];toast(`Abrindo ${a[0]}…`,()=>{if(a[2]){S.scr=a[2];draw()}});return 'skip'}};
$('#stage').addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
if(a=='seek'){const r=el.getBoundingClientRect();S.t=Math.floor((e.clientX-r.left)/r.width*T[S.tr][2]);return draw()}
if(A[a]&&A[a](el.dataset)==='skip')return;draw()});
$('#stage').addEventListener('input',e=>{const k=e.target.dataset.k;if(!k||e.target.type!='range')return;st(k,+e.target.value);document.documentElement.style.setProperty('--b',S.bright/100)});
setInterval(()=>{if(S.play&&++S.t>=T[S.tr][2]){if(S.rep)S.t=0;else nx(1)}if(S.call)S.call.s++;if(S.nav)S.spd=48+Math.round(Math.random()*8);
document.querySelectorAll('.ct').forEach(e=>e.textContent=S.scr=='music'&&e.id=='pt'?mm(S.t):mm(S.call?S.call.s:0));
const p=$('#pg i');if(p)p.style.width=S.t/T[S.tr][2]*100+'%';const s=$('#spd');if(s)s.textContent=S.nav?S.spd:0},1000);
function fit(){const k=Math.min(innerWidth/1224,innerHeight/544);$('#stage').style.transform=`translate(-50%,-50%) scale(${k})`}
addEventListener('resize',fit);fit();draw();
</script></body></html>
